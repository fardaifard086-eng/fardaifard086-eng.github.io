    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #f4f6f8; color: #333; }
        
        /* هدر و نوار ساعت */
        header { background: #fff; box-shadow: 0 2px 15px rgba(0,0,0,0.1); padding: 15px; position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 0.9rem; color: #555; font-weight: bold; }
        .logo h1 { color: #1d3557; font-size: 1.3rem; text-align: center; }
        .logo span { color: #e63946; }
        
        /* استایل عکس بالای سایت */
        .hero-image-container { width: 100%; max-width: 1200px; margin: 20px auto 0; padding: 0 15px; text-align: center; }
        .hero-image { width: 100%; max-height: 400px; object-fit: contain; background-color: #e0e0e0; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

        /* کادر جستجو */
        .search-container { max-width: 600px; margin: 20px auto; padding: 0 15px; position: sticky; top: 110px; z-index: 99; text-align: center; }
        .search-container input {
            width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 50px;
            font-size: 1rem; outline: none; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: 0.3s; background: #fff;
        }
        .search-container input:focus { border-color: #e63946; box-shadow: 0 4px 15px rgba(230,57,70,0.2); }
        .search-hint { font-size: 0.8rem; color: #888; margin-top: 8px; display: block; }

        /* شبکه غذاها */
        .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 50px; padding: 0 15px; }
        
        .food-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: 0.3s; display: flex; flex-direction: column; }
        .food-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .food-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .food-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .food-info h3 { color: #1d3557; font-size: 1.1rem; margin-bottom: 5px; }
        .food-info p { color: #6c757d; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.4; height: 38px; overflow: hidden; }
        .food-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #eee; padding-top: 10px; }
        .price { color: #e63946; font-weight: bold; font-size: 1rem; }
        .add-btn { background: #1d3557; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .add-btn:hover { background: #e63946; }

        .not-found { text-align: center; color: #e63946; font-size: 1.2rem; grid-column: 1 / -1; display: none; margin: 30px 0; font-weight: bold; }
    </style>
