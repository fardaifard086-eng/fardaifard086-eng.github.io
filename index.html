<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رستوران فردین نبی زاده</title>
    <style>
        :root { 
            --primary: #c1121f; 
            --dark: #003049;    
            --accent: #ffb703;  
            --light: #f4f6f8;   
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--light); color: #333; display: flex; flex-direction: column; min-height: 100vh; }

        /* هدر بزرگ‌تر */
        header { 
            background: var(--dark); 
            color: white; 
            padding: 35px 20px; /* ارتفاع بیشتر */
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); 
        }
        .logo h1 { font-size: 2.2rem; font-weight: bold; color: #ffffff; margin: 0; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        /* عکس ماهی */
        .hero { width: 100%; max-width: 800px; margin: 30px auto; padding: 0 15px; text-align: center; }
        .hero img { 
            width: 100%; 
            max-height: 400px; 
            object-fit: contain; 
            background: #fff; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
            border: 4px solid white; 
        }

        /* کادر جستجو */
        .search-box { max-width: 700px; margin: 0 auto 40px; padding: 0 15px; position: relative; }
        .search-box input { 
            width: 100%; padding: 18px 25px; border: none; border-radius: 50px; 
            font-size: 1.2rem; outline: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            transition: 0.3s; 
        }
        .search-box input:focus { box-shadow: 0 5px 25px rgba(193, 18, 31, 0.4); border: 2px solid var(--primary); }

        /* شبکه غذاها */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* کارت‌ها کمی پهن‌تر */
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 60px 20px; 
            flex: 1; 
        }
        
        /* کارت غذا (درازتر) */
        .card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #eee;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        
        /* کادر عکس غذا (ارتفاع بیشتر) */
        .img-container { 
            width: 100%; 
            height: 250px; /* ارتفاع بیشتر برای درازتر شدن */
            background: #e9ecef; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5rem; /* آیکون بشقاب بزرگ‌تر */
            color: #adb5bd; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* محتوای کارت */
        .card-content { padding: 25px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.4rem; font-weight: bold; color: var(--dark); margin-bottom: 12px; }
        .card-desc { font-size: 1rem; color: #6c757d; margin-bottom: 20px; line-height: 1.6; flex: 1; }
        
        /* فوتر کارت */
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #dee2e6; padding-top: 20px; }
        .price { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .btn { background: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1rem; }
        .btn:hover { background: var(--primary); transform: scale(1.05); }
        
        .no-result { text-align: center; font-size: 1.4rem; color: var(--primary); font-weight: bold; grid-column: 1 / -1; padding: 50px; display: none; }

        /* فوتر پایین سایت (بزرگ‌تر) */
        footer { 
            background: var(--dark); 
            color: white; 
            text-align: center; 
            padding: 50px 20px; 
            margin-top: auto; 
            border-top: 5px solid var(--accent); 
        }
        .footer-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .footer-title { font-size: 1.8rem; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .footer-info { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; font-size: 1.1rem; opacity: 0.95; }
        .footer-info span { display: flex; align-items: center; gap: 8px; }
        .copyright { font-size: 0.95rem; opacity: 0.7; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 20px; }
    </style>
</head>
<body>

    <!-- هدر بزرگ -->
    <header>
        <div class="logo">
            <h1>رستوران <span>فردین نبی زاده</span></h1>
        </div>
    </header>

    <!-- عکس ماهی -->
    <div class="hero">
        <img src="https://linkgostarbot.ir/bot/download/4878209/6523321285/Screenshot_2026_11_11_14_48_16_913_com_miui_gallery.jpg" alt="ماهی تازه">
    </div>

    <!-- جستجو -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 جستجوی ۱۵ غذای ایرانی..." onkeyup="filterFoods()">
    </div>

    <!-- ظرف غذاها -->
    <div class="grid-container" id="foodContainer"></div>

    <!-- فوتر بزرگ -->
    <footer>
        <div class="footer-content">
            <div class="footer-title">رستوران فردین نبی زاده</div>
            <div class="footer-info">
                <span>📍 تهران، خیابان اصلی</span>
                <span>📞 ۰۲۱-۱۲۳۴۵۶۷۸</span>
                <span>⏰ ۱۲ ظهر تا ۱۲ شب</span>
            </div>
            <div class="copyright">
                © ۱۴۰۳ تمامی حقوق برای رستوران فردین نبی زاده محفوظ است.
            </div>
        </div>
    </footer>

    <script>
        var foods = [
            { n: "چلوکباب کوبیده", d: "دو سیخ کباب کوبیده گوسفندی، برنج ایرانی، کره", p: "۳۵۰,۰۰۰", i: "https://images.pexels.com/photos/1105325/pexels-photo-1105325.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "جوجه کباب زعفرانی", d: "یک سیخ جوجه کباب، برنج، گوجه کبابی", p: "۲۸۰,۰۰۰", i: "https://images.pexels.com/photos/2338407/pexels-photo-2338407.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "قورمه سبزی", d: "خورش قورمه سبزی مجلسی با گوشت گوساله", p: "۲۵۰,۰۰۰", i: "https://images.pexels.com/photos/5737463/pexels-photo-5737463.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "خورش فسنجان", d: "خورش فسنجان با مرغ و گردو", p: "۲۸۰,۰۰۰", i: "https://images.pexels.com/photos/6210959/pexels-photo-6210959.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "قیمه نثار", d: "خورش قیمه با خلال سیب‌زمینی و بادام", p: "۲۶۰,۰۰۰", i: "https://images.pexels.com/photos/1279330/pexels-photo-1279330.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "زرشک پلو با مرغ", d: "ران مرغ زعفرانی با زرشک", p: "۲۴۰,۰۰۰", i: "https://images.pexels.com/photos/1211887/pexels-photo-1211887.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "باقالی پلو با ماهیچه", d: "ماهیچه گوسفندی با باقالی پلو", p: "۴۸۰,۰۰۰", i: "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "میرزاقاسمی", d: "بادمجان کبابی با گوجه و سیر", p: "۱۶۰,۰۰۰", i: "https://images.pexels.com/photos/262959/pexels-photo-262959.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "کشک بادمجان", d: "بادمجان با کشک و نعنا", p: "۱۵۰,۰۰۰", i: "https://images.pexels.com/photos/5410400/pexels-photo-5410400.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "آش رشته", d: "آش رشته سنتی با کشک و نعنا", p: "۱۲۰,۰۰۰", i: "https://images.pexels.com/photos/5409751/pexels-photo-5409751.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "دیزی سنتی", d: "آبگوشت سنتی با نان سنگک", p: "۲۲۰,۰۰۰", i: "https://images.pexels.com/photos/6210959/pexels-photo-6210959.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "پیتزا پپرونی", d: "پیتزا با پنیر موزارلا و پپرونی", p: "۳۲۰,۰۰۰", i: "https://images.pexels.com/photos/825661/pexels-photo-825661.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "برگر دوبل", d: "برگر دوبل با پنیر چدار", p: "۲۹۰,۰۰۰", i: "https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "سیب‌زمینی سرخ‌کرده", d: "سیب‌زمینی سرخ‌کرده با سس", p: "۸۰,۰۰۰", i: "https://images.pexels.com/photos/1583884/pexels-photo-1583884.jpeg?auto=compress&cs=tinysrgb&w=500" },
            { n: "بستنی سنتی", d: "بستنی سنتی زعفرانی", p: "۹۰,۰۰۰", i: "https://images.pexels.com/photos/1352281/pexels-photo-1352281.jpeg?auto=compress&cs=tinysrgb&w=500" }
        ];

        function displayFoods(itemsToShow) {
            var container = document.getElementById('foodContainer');
            var html = '';

            if (itemsToShow.length === 0) {
                container.innerHTML = '<div class="no-result" style="display:block;">غذایی با این مشخصات یافت نشد!</div>';
                return;
            }

            for (var i = 0; i < itemsToShow.length; i++) {
                var f = itemsToShow[i];
                html += '<div class="card">';
                html += '<div class="img-container">🍽️';
                html += '<img src="' + f.i + '" alt="' + f.n + '" onerror="this.style.display=\'none\'">';
                html += '</div>';
                
                html += '<div class="card-content">';
                html += '<div class="card-title">' + f.n + '</div>';
                html += '<div class="card-desc">' + f.d + '</div>';
                html += '<div class="card-footer">';
                html += '<span class="price">' + f.p + ' تومان</span>';
                html += '<button class="btn" onclick="alert(\'به سبد خرید اضافه شد!\')">افزودن</button>';
                html += '</div></div></div>';
            }
            
            container.innerHTML = html;
        }

        function filterFoods() {
            var input = document.getElementById('searchInput').value.trim().toLowerCase();
            var filtered = [];
            
            for (var i = 0; i < foods.length; i++) {
                if (foods[i].n.toLowerCase().indexOf(input) !== -1 || foods[i].d.toLowerCase().indexOf(input) !== -1) {
                    filtered.push(foods[i]);
                }
            }
            displayFoods(filtered);
        }

        window.onload = function() {
            displayFoods(foods);
        };
    </script>
</body>
</html>
