<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رستوران فردین نبی زاده</title>
    <style>
        :root { 
            --primary: #c1121f; 
            --dark: #003049;    
            --accent: #ffb703;  
            --light: #f4f6f8;   
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { 
            width: 100%; 
            overflow-x: hidden; 
            background-color: var(--light); 
            color: #333; 
        }

        /* هدر بزرگ و تمام عرض */
        header { 
            width: 100%;
            background: var(--dark); 
            color: white; 
            padding: 35px 20px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); 
        }
        .logo h1 { font-size: 2rem; font-weight: bold; color: #ffffff; margin: 0; }
        .logo span { color: var(--accent); }

        /* عکس ماهی وسط‌چین */
        .hero { 
            width: 100%; 
            display: flex;
            justify-content: center; 
            margin: 20px 0; 
            padding: 0 15px;
        }
        .hero img { 
            width: 100%;
            max-width: 700px; 
            max-height: 350px; 
            object-fit: cover; 
            background: #e0e0e0; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
            border: 4px solid white; 
        }

        /* کادر جستجو وسط‌چین */
        .search-container {
            width: 100%;
            display: flex;
            justify-content: center; 
            padding: 0 15px;
            margin-bottom: 30px;
        }
        .search-box { 
            width: 100%; 
            max-width: 600px; 
            position: relative; 
        }
        .search-box input { 
            width: 100%; 
            padding: 18px 25px; 
            border: none; 
            border-radius: 50px; 
            font-size: 1.2rem; 
            outline: none; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            transition: 0.3s; 
        }
        .search-box input:focus { 
            box-shadow: 0 5px 25px rgba(193, 18, 31, 0.4); 
            border: 2px solid var(--primary); 
        }

        /* شبکه غذاها */
        .grid-container { 
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto 60px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
        }
        
        /* کارت غذا */
        .card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #eee;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        
        .img-container { 
            width: 100%; 
            height: 220px; 
            background: #e9ecef; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5rem; 
            color: #adb5bd; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        .card-content { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.3rem; font-weight: bold; color: var(--dark); margin-bottom: 10px; }
        .card-desc { font-size: 0.95rem; color: #6c757d; margin-bottom: 20px; line-height: 1.5; flex: 1; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #dee2e6; padding-top: 15px; }
        .price { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .btn { background: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.9rem; }
        .btn:hover { background: var(--primary); transform: scale(1.05); }
        
        .no-result { text-align: center; font-size: 1.4rem; color: var(--primary); font-weight: bold; grid-column: 1 / -1; padding: 50px; display: none; }

        /* فوتر پایین سایت */
        footer { 
            width: 100%;
            background: var(--dark); 
            color: white; 
            text-align: center; 
            padding: 40px 20px; 
            border-top: 5px solid var(--accent); 
        }
        .footer-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .footer-title { font-size: 1.6rem; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .footer-info { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; font-size: 1rem; opacity: 0.95; }
        .footer-info span { display: flex; align-items: center; gap: 8px; }
        .copyright { font-size: 0.9rem; opacity: 0.7; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 20px; }
        
        @media (max-width: 600px) {
            .logo h1 { font-size: 1.6rem; }
            .grid-container { grid-template-columns: 1fr; } 
            .footer-info { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- هدر -->
    <header>
        <div class="logo">
            <h1>رستوران <span>فردین نبی زاده</span></h1>
        </div>
    </header>

    <!-- عکس ماهی -->
    <div class="hero">
        <img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=800&q=80" alt="ماهی تازه">
    </div>

    <!-- کادر جستجو -->
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 جستجوی غذا..." onkeyup="filterFoods()">
        </div>
    </div>

    <!-- ظرف غذاها -->
    <div class="grid-container" id="foodContainer"></div>

    <!-- فوتر -->
    <footer>
        <div class="footer-content">
            <div class="footer-title">رستوران فردین نبی زاده</div>
            <div class="footer-info">
                <span>📍 تهران، خیابان اصلی</span>
                <span>📞 ۰۲۱-۱۲۳۴۵۶۷۸</span>
                <span>⏰ ۱۲ ظهر تا ۱۲ شب</span>
            </div>
            <div class="copyright">
                © ۱۴۰۳ تمامی حقوق برای رستوران فردین نبی زاده محفوظ است.
            </div>
        </div>
    </footer>

    <script>
        // لیست ۱۰ غذای مهم و محبوب (عکس‌ها دقیقاً مرتبط با غذاها)
        var foods = [
            { n: "چلوکباب کوبیده", d: "دو سیخ کباب کوبیده گوسفندی، برنج ایرانی، کره", p: "۳۵۰,۰۰۰", i: "https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=80" },
            { n: "جوجه کباب زعفرانی", d: "یک سیخ جوجه کباب، برنج، گوجه کبابی", p: "۲۸۰,۰۰۰", i: "https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=500&q=80" },
            { n: "چلو مرغ زعفرانی", d: "ران مرغ زعفرانی با برنج ایرانی، کره و گوجه", p: "۲۳۰,۰۰۰", i: "https://images.unsplash.com/photo-1598514982205-f36b96d1e8dd?w=500&q=80" },
            { n: "قورمه سبزی", d: "خورش قورمه سبزی مجلسی با گوشت گوساله", p: "۲۵۰,۰۰۰", i: "https://images.unsplash.com/photo-1547592180-85f173990554?w=500&q=80" },
            { n: "قیمه نثار", d: "خورش قیمه با خلال سیب‌زمینی و بادام", p: "۲۶۰,۰۰۰", i: "https://images.unsplash.com/photo-1574484284002-952d92456975?w=500&q=80" },
            { n: "زرشک پلو با مرغ", d: "ران مرغ زعفرانی همراه با زرشک و برنج", p: "۲۴۰,۰۰۰", i: "https://images.unsplash.com/photo-1580476262798-bddd9f4b7369?w=500&q=80" },
            { n: "پیتزا پپرونی", d: "پیتزا با پنیر موزارلا، پپرونی و سس مخصوص", p: "۳۲۰,۰۰۰", i: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500&q=80" },
            { n: "برگر دوبل", d: "برگر دوبل با گوشت چرخ‌کرده و پنیر چدار", p: "۲۹۰,۰۰۰", i: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80" },
            { n: "سالاد شیرازی", d: "خیار، گوجه، پیاز و آبغوره تازه", p: "۶۰,۰۰۰", i: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=80" },
            { n: "دوغ محلی", d: "دوغ گازدار سنتی با نعنا", p: "۴۰,۰۰۰", i: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&q=80" }
        ];

        function displayFoods(itemsToShow) {
            var container = document.getElementById('foodContainer');
            var html = '';

            if (itemsToShow.length === 0) {
                container.innerHTML = '<div class="no-result" style="display:block;">غذایی با این مشخصات یافت نشد!</div>';
                return;
            }

            for (var i = 0; i < itemsToShow.length; i++) {
                var f = itemsToShow[i];
                html += '<div class="card">';
                html += '<div class="img-container">🍽️';
                // قابلیت جایگزینی در صورت لود نشدن عکس
                html += '<img src="' + f.i + '" alt="' + f.n + '" onerror="this.style.display=\'none\'">';
                html += '</div>';
                
                html += '<div class="card-content">';
                html += '<div class="card-title">' + f.n + '</div>';
                html += '<div class="card-desc">' + f.d + '</div>';
                html += '<div class="card-footer">';
                html += '<span class="price">' + f.p + ' تومان</span>';
                html += '<button class="btn" onclick="alert(\'به سبد خرید اضافه شد!\')">افزودن</button>';
                html += '</div></div></div>';
            }
            
            container.innerHTML = html;
        }

        function filterFoods() {
            var input = document.getElementById('searchInput').value.trim().toLowerCase();
            var filtered = [];
            
            for (var i = 0; i < foods.length; i++) {
                if (foods[i].n.toLowerCase().indexOf(input) !== -1 || foods[i].d.toLowerCase().indexOf(input) !== -1) {
                    filtered.push(foods[i]);
                }
            }
            displayFoods(filtered);
        }

        // لود کردن سریع بعد از باز شدن صفحه
        window.onload = function() {
            displayFoods(foods);
        };
    </script>
</body>
</html>
